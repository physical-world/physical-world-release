[workspace]
authors = ["Wentao He <wentaohe@umich.edu>"]
channels = ["conda-forge"]
name = "physical"
platforms = [{ platform = "linux-64", cuda = "12.8" }]
version = "0.1.0"

[dependencies]
python = "3.10.*"
pip = ">=24"
setuptools = "<81"
ffmpeg = "4.3.*"
glew = "2.1.*"
numpy = "1.26.*"
pillow = "10.*"
scipy = "1.13.*"
matplotlib = "3.5.*"
scikit-image = "0.19.*"
scikit-learn = "1.5.*"
cython = "0.29.*"
patchelf = ">=0.17,<1"
basedpyright = ">=1.39.8,<2"
pytest = ">=8,<9"

[pypi-dependencies]
accelerate = "==0.26.1"
colorama = ">=0.4.6,<0.5"
decord = "==0.6.0"
dm-control = "==1.0.27"
einops = "==0.4.1"
glfw = "==2.7.0"
gym = "==0.23.1"
gymnasium = "==1.2.3"
gymnasium-robotics = "==1.4.2"
hydra-core = "==1.3.2"
imageio-ffmpeg = "==0.4.9"
mujoco = "==3.2.7"
omegaconf = "==2.3.0"
opencv-python = "==4.6.0.66"
plotly = "==5.22.0"
protobuf = "==3.20.3"
psutil = "==5.9.8"
pygame = "==2.6.1"
pymunk = "==6.11.1"
shapely = "==2.1.2"
tensorboard = "==2.15.2"
tensorboardx = "==2.6.2.2"
termcolor = "==2.4.0"
tqdm = "==4.66.4"
typed-argument-parser = ">=1.10,<2"
wandb = "==0.13.1"
zarr = "==2.17.2"
ipywidgets = ">=8, <9"
matplotlib-inline = "==0.1.7"
ipykernel = "==6.29.5"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cu128" }
transformers = "==5.15.1"

[tasks]
check-imports = "python -c \"import torch, torchvision, hydra, omegaconf, zarr, mujoco, dm_control, accelerate, wandb, cv2, decord; print('ok', torch.__version__, torch.cuda.is_available())\""
