img_size: 224
frameskip: 5
action_emb_dim: 10
proprio_emb_dim: 10
num_hist: 3
num_pred: 1
encoder:
  name: dinov2_vits14
  feature_key: x_norm_patchtokens
  projector: channel
  agg_type: mlp
  agg_mlp_hidden_dim: 512
  agg_out_dim: 128
  projector_out_dim: 8
  hidden_dim: 192
  projector_config:
    in_dim: 384
    out_dim: 8
    norm_type: layer
    conv_layers:
    - kernel_size: 3
      stride: 1
      padding: 1
      in_dim: 384
      out_dim: 192
    - kernel_size: 3
      stride: 1
      padding: 1
      in_dim: 192
      out_dim: 8
action_encoder:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
proprio_encoder:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
decoder:
  channel: 384
  n_embed: 2048
  n_res_block: 4
  n_res_channel: 128
  quantize: false
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0
  pool: mean
model:
  image_size: 224
  num_hist: 3
  num_pred: 1
  train_encoder: true
  train_predictor: true
  train_decoder: true
env:
  name: pusht
  dataset: {}
training:
  straighten: aggcos1e-1
