img_size: 224
frameskip: 5
action_emb_dim: 10
proprio_emb_dim: 10
num_hist: 3
num_pred: 1
encoder:
  name: dinov2_vits14
  feature_key: x_norm_patchtokens
action_encoder:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
proprio_encoder:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
decoder:
  channel: 384
  n_embed: 2048
  n_res_block: 4
  n_res_channel: 128
  quantize: false
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0
  pool: mean
model:
  image_size: 224
  num_hist: 3
  num_pred: 1
  train_encoder: false
  train_predictor: true
  train_decoder: true
  ctx_token_dim: 64
  ctx_detach_for_predictor: false
  extra_losses: {}
  proprio_loss_weight: 0.5
ctx_encoder:
  l2_normalize: false
  use_layer_norm: false
ctx_img_model:
  name: resnet18
  gn_num_groups: 8
  weights: null
  num_kp: 64
ctx_pool_model:
  hidden_dim: 512
  depth: 4
  n_heads: 8
  mlp_hidden_dim: 1024
  head_dim: 64
  dropout: 0.0
  emb_dropout: 0.0
  use_rope: false
ctx_act_model:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
ctx_prop_model:
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
ctx_token_dim: 64
env:
  name: pusht
  dataset:
    use_ctx: true
    use_cog_local_normed: false
    ctx_length: 60
    ctx_frameskip: 5
training:
  straighten: aggcos1e-1
